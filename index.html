<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>SKILLS TEST</title>
</head>
<body>
    <div class="app-card">
        <div class="app-header">
            <h1>Non-Metal Elements</h1>
            <p>Periodic Table Information Finder</p>
        </div>

        <div class="app-body">
            <div class="instructions">
                <strong>Instructions:</strong>
                Enter the symbol of a non-metal element (Example: H, O, Cl, Ne, Xe, Arbisonium, Alananium).
            </div>

            <label class="form-label-custom" for="elementInput">
                <i class="bi bi-search"></i> Element Symbol
            </label>
            <input type="text" id="elementInput" placeholder="Enter element symbol">
            <button id="submitBtn" py-click="show_element">Check Details</button>

            <div class="result-section">
                <h3 class="result-title"><i class="bi bi-list-ul"></i> Result</h3>
                <div id="results" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
